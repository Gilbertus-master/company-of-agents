# Fleet manifest – source of truth for scheduled tasks, cron, priority, model and prompts (flota/generuj.py).
# Fields: agent (taskId = <prefiks>-<agent>-<konto>), katalog (name in koordynacja-odstepy.tsv; null = outside the lock),
#   priorytet P1/P2/P3 (budget: limit ≥ 85% → P3 does not work, ≥ 95% → nor does P2), cron (time zone from org.yaml),
#   konto_w_prompcie, prompt (output file), tresc (content template), model (CLASS from org.yaml → runtime.modele: sedzia | mocny |
#   lekki | mechaniczny – never a model ID; a new model is changed in one place), opis,
#   USD BUDGETS: with org.yaml → runtime.rozliczenie = api – amounts; with team – WEIGHTS that flota/generuj.py scales to the
#   fleet account capacity ((pojemnosc_miejsca_usd_miesiac + nadwyzka_usd_miesiac) × wykorzystanie_cel_proc) → flota/budzety.tsv:
#   budzet_usd_przebieg (hard limit --max-budget-usd in scripts/przebieg-headless.sh; default: the global value),
#   budzet_usd_dzien (soft: once exceeded scripts/przebieg.sh prints BUDŻET-AGENTA – the agent works only in ZDARZENIE mode),
#   budzet_usd_miesiac (80 % → warning; 100 % → przebieg.sh exits with code 10 without work; fleet ceiling in org.yaml → HALT),
#   efekt (effort for scheduled tasks: low/medium/high), konektory (list of MCP connectors needed in the cloud).
# AGENT CONTRACT (rec. 9 – rule of two, AI register): typ reader|actor|researcher (a reader reads untrusted content – the hook blocks
#   its sending, payments, deployments; a researcher uses public sources only, no mailboxes), wlasciciel_ludzki (role from org.yaml: operator|wlasciciel),
#   narzedzia (allowed connectors/CLIs), domeny (sandbox allowedDomains), autonomia (auto|aprobata|eskalacja – per task type).
# Change: edit → python3 flota/generuj.py → commit the prompts together with the manifest. Order = order of task creation.
model: mocny                 # default class; classes → model IDs: org.yaml → runtime.modele
budzet_usd_przebieg: 2
budzet_usd_dzien: 5
budzet_usd_miesiac: 25       # per agent (Paperclip: specialist 10–25, lead 20–40, CEO 30–50 USD/month); 80 % warning, 100 % CISZA
max_tur: 60
zadania:
- agent: limit
  katalog: null
  priorytet: P1
  cron: '*/30 * * * *'
  konto_w_prompcie: A
  prompt: ceo/handoff/prompty/limit.md
  tresc: flota/szablony/tresc/limit.md
  model: mechaniczny   # closed list of actions (limit measurement, regulator) – no judgement
  budzet_usd_przebieg: 0.2
  budzet_usd_dzien: 1
  budzet_usd_miesiac: 2
  typ: actor
  wlasciciel_ludzki: operator
  domeny: [api.github.com, github.com]
  autonomia: aprobata
  opis: 'Regulator tempa limitu konta Claude (co 30 min): cel równego zużycia okna, hamowanie P3/P2, przy 98% Pilne do CEO – dalej płatna nadwyżka albo tylko P1 do resetu (bez rotacji kont). Tworzyć jako PIERWSZE zadanie na koncie floty.'
- agent: scalanie
  katalog: null
  priorytet: P1
  cron: '*/15 * * * *'
  konto_w_prompcie: A
  prompt: ceo/handoff/prompty/scalanie.md
  tresc: flota/szablony/tresc/scalanie.md
  model: mechaniczny   # executes a closed list of actions from the script – no judgement involved
  budzet_usd_przebieg: 0.3
  budzet_usd_dzien: 3
  budzet_usd_miesiac: 10
  typ: actor
  wlasciciel_ludzki: operator
  domeny: [api.github.com, github.com]
  autonomia: aprobata
  opis: 'Agent scalający (co 15 min): pod blokadą scala PR-y klasy GOTOWY poleceniem z tabeli scripts/scalanie.py (werdykt recenzenta dla bieżącego commita, zielone CI, bez migracji i plików zastrzeżonych), resztę zgłasza temu, kto usuwa przeszkodę. Tworzyć jako DRUGIE zadanie na każdym koncie, zaraz po limit. Opis: ceo/scalanie/README.md.'
- agent: ceo
  katalog: ceo
  priorytet: P1
  cron: '30 7-21 * * *'
  konto_w_prompcie: A
  prompt: ceo/handoff/prompty/ceo.md
  tresc: flota/szablony/tresc/ceo.md
  model: mocny
  budzet_usd_przebieg: 4
  budzet_usd_dzien: 15
  budzet_usd_miesiac: 50
  typ: actor
  wlasciciel_ludzki: operator
  domeny: [api.github.com, github.com]
  autonomia: aprobata
  opis: 'Zarządzanie organizacją: plan, KPI, priorytety, blokady, zgody w granicach uprawnień, kolejka operatora; co 1 h 7:30–21:30, pełny przegląd w poniedziałek.'
- agent: recenzent
  katalog: recenzent
  priorytet: P1
  cron: '45 7-21 * * *'
  konto_w_prompcie: A
  prompt: ceo/handoff/prompty/recenzent.md
  tresc: flota/szablony/tresc/_agent.md
  model: sedzia   # strongest model and a different family than the PR authors (class mocny) – judge self-preference bias
  budzet_usd_przebieg: 3
  budzet_usd_dzien: 10
  budzet_usd_miesiac: 40
  typ: actor
  wlasciciel_ludzki: operator
  domeny: [api.github.com, github.com]
  autonomia: aprobata
  opis: 'Niezależna bramka jakości: werdykt dla każdego PR-a (head SHA), klasa migracji, próba wycofana; uruchamiany przez CEO przy każdym PR-ze, harmonogram to siatka.'
- agent: pm
  katalog: pm
  priorytet: P1
  cron: '45 0-21/3 * * *'
  konto_w_prompcie: A
  prompt: ceo/handoff/prompty/pm.md
  tresc: flota/szablony/tresc/_agent.md
  model: mocny
  typ: actor
  wlasciciel_ludzki: operator
  domeny: [api.github.com, github.com]
  autonomia: aprobata
  opis: 'Backlog organizacji, terminy, dyżur blokad, przegląd zasadności zadań cyklicznych i kosztu floty.'
- agent: architekt
  katalog: architekt
  priorytet: P1
  cron: '15 */3 * * *'
  konto_w_prompcie: A
  prompt: ceo/handoff/prompty/architekt.md
  tresc: flota/szablony/tresc/_agent.md
  model: mocny
  budzet_usd_przebieg: 6
  budzet_usd_dzien: 15
  budzet_usd_miesiac: 40
  typ: actor
  wlasciciel_ludzki: operator
  domeny: [api.github.com, github.com]
  autonomia: aprobata
  opis: 'Lider pionu Produkt: projekty funkcji, plany, przegląd architektury, toolbelt techniczny.'
